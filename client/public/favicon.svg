<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18241F" />
      <stop offset="100%" stop-color="#0C1311" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67D6BC" />
      <stop offset="100%" stop-color="#1E9C80" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59A8C" />
      <stop offset="100%" stop-color="#EF7564" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#34C3A2" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#24342E" stroke-width="1.5" />

  <!-- Cartão de trás (coral) -->
  <rect x="18" y="14" width="34" height="22" rx="4.5" fill="url(#accentGrad)" opacity="0.7" transform="rotate(-6 35 25)" />

  <!-- Cartão da frente (jade) -->
  <g filter="url(#glow)">
    <rect x="11" y="21" width="42" height="27" rx="5" fill="url(#cardGrad)" stroke="#95DDA0" stroke-width="0.8" />
    <rect x="11" y="27" width="42" height="5" fill="#0C3D32" opacity="0.7" />
    <rect x="16" y="36" width="7" height="6" rx="1.5" fill="#F2CB78" opacity="0.95" />
    <line x1="16" y1="39" x2="23" y2="39" stroke="#C9932A" stroke-width="0.6" />
    <line x1="19.5" y1="36" x2="19.5" y2="42" stroke="#C9932A" stroke-width="0.6" />
    <circle cx="43" cy="39" r="3" fill="#ECF2EF" opacity="0.9" />
    <circle cx="47" cy="39" r="3" fill="#04221B" opacity="0.35" />
  </g>
</svg>
