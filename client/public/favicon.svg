<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Back Card Shadow / Accent -->
  <rect x="18" y="14" width="34" height="22" rx="4.5" fill="url(#accentGrad)" opacity="0.6" transform="rotate(-6 35 25)" />

  <!-- Main Front Credit Card with Glow -->
  <g filter="url(#glow)">
    <rect x="11" y="21" width="42" height="27" rx="5" fill="url(#cardGrad)" stroke="#34d399" stroke-width="0.8" />
    
    <!-- Magnetic / Decorative Stripe -->
    <rect x="11" y="27" width="42" height="5" fill="#065f46" opacity="0.75" />

    <!-- Card Chip -->
    <rect x="16" y="36" width="7" height="6" rx="1.5" fill="#fef08a" opacity="0.95" />
    <line x1="16" y1="39" x2="23" y2="39" stroke="#ca8a04" stroke-width="0.6" />
    <line x1="19.5" y1="36" x2="19.5" y2="42" stroke="#ca8a04" stroke-width="0.6" />

    <!-- Card Dots / Contactless waves -->
    <circle cx="43" cy="39" r="3" fill="#ffffff" opacity="0.85" />
    <circle cx="47" cy="39" r="3" fill="#a7f3d0" opacity="0.65" />
  </g>
</svg>